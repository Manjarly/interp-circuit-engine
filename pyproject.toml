[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "interp-circuit-engine"
version = "0.1.0"
description = "End-to-End Mechanistic Interpretability Suite: Extraction, Auto-Labeling, and Latent Steering"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Antigravity Research Team"}
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "einops>=0.7.0",
    "accelerate>=0.28.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pytest>=8.0.0",
    "tqdm>=4.66.0",
    "pandas>=2.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "black>=24.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=5"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
